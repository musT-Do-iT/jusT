<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스캠퍼 발문 카드 만들기</title>
<style>
:root {
  --color-bg: #fdf9f0;
  --color-text: #33302a;
  --color-primary: #ff8a3d;
  --color-primary-dark: #e56f22;
  --color-danger: #c23e50;
  --color-card-border: #e8e0d0;
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  font-size: 18px;
  line-height: 1.55;
}

.app-header {
  text-align: center;
  padding: 32px 16px 12px;
}

.app-header h1 {
  margin: 0 0 6px;
  font-size: clamp(22px, 4vw, 32px);
}

.subtitle {
  margin: 0;
  color: #5b5749;
  font-size: 16px;
}

main {
  max-width: 960px;
  margin: 0 auto;
  padding: 16px 20px 60px;
}

.screen {
  display: none;
}

.screen.is-active {
  display: block;
}

/* 시작 화면 */
.topic-form {
  max-width: 520px;
  margin: 40px auto 0;
  background: #fff;
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
  text-align: center;
}

.topic-form label {
  display: block;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
}

.topic-input-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

#topic-input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 44px;
  font-size: 18px;
  padding: 10px 14px;
  border: 2px solid var(--color-card-border);
  border-radius: 10px;
  outline: none;
}

#topic-input:focus {
  border-color: var(--color-primary-dark);
  box-shadow: 0 0 0 3px rgba(229, 111, 34, 0.28);
}

.error-message {
  color: var(--color-danger);
  font-size: 16px;
  font-weight: 700;
  margin: 12px 0 0;
}

/* 버튼 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  font-size: 18px;
  font-weight: 700;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: var(--color-text);
  transition: transform 0.08s ease, opacity 0.15s ease;
}

.btn:active {
  transform: scale(0.97);
}

.btn:focus-visible {
  outline: 3px solid var(--color-text);
  outline-offset: 2px;
}

.btn-primary {
  background: var(--color-primary);
}

.btn-primary:hover {
  background: var(--color-primary-dark);
}

.btn-secondary {
  background: #eef1fb;
}

.btn-danger {
  background: #fdeef0;
}

.btn-outline {
  background: #fff;
  border: 2px solid var(--card-color, var(--color-primary));
  width: 100%;
}

.btn-outline:hover {
  background: var(--card-bg, #fff);
}

/* 카드 화면 */
.cards-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 24px 0 20px;
}

.current-topic {
  font-size: 18px;
  margin: 0;
}

.toolbar-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.cards-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

/* SCAMPER 카드 */
.scamper-card {
  background: var(--card-bg, #fff);
  border: 1px solid var(--color-card-border);
  border-top: 6px solid var(--card-color, var(--color-primary));
  border-radius: var(--radius);
  padding: 18px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.card-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--card-color, var(--color-primary));
  color: var(--color-text);
  font-weight: 800;
  font-size: 18px;
  flex-shrink: 0;
}

.card-title {
  margin: 0;
  font-size: 19px;
}

.question-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.question-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.question-text {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  color: var(--color-text);
}

.answer-input {
  width: 100%;
  min-height: 44px;
  font-family: inherit;
  font-size: 18px;
  padding: 10px 12px;
  background: #fff;
  border: 1.5px solid var(--color-card-border);
  border-radius: 8px;
  resize: vertical;
  outline: none;
}

.answer-input:focus {
  border-color: var(--card-color, var(--color-primary));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--card-color, var(--color-primary)) 30%, transparent);
}

.btn-regenerate {
  padding: 9px 14px;
  margin-top: auto;
}

/* 결과 화면 */
.result-layout {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 20px;
  align-items: start;
}

.result-summary-panel,
.result-qr-panel {
  background: #fff;
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
}

.result-panel-title {
  margin: 0 0 14px;
  font-size: 19px;
}

.result-summary-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.result-summary-item {
  border-left: 5px solid var(--card-color, var(--color-primary));
  background: var(--card-bg, #faf8f3);
  border-radius: 0 10px 10px 0;
  padding: 10px 14px;
}

.result-summary-badge {
  display: inline-block;
  font-size: 18px;
  font-weight: 800;
  color: var(--color-text);
  margin-bottom: 4px;
}

.result-summary-question {
  margin: 0 0 4px;
  font-size: 18px;
  font-weight: 600;
}

.result-summary-answer {
  margin: 0;
  font-size: 18px;
  color: var(--color-text);
  white-space: pre-wrap;
}

.result-empty-message {
  color: #5b5749;
  font-size: 18px;
  margin: 0;
}

.result-qr-desc {
  margin: 0 0 16px;
  font-size: 16px;
  color: #5b5749;
}

.qr-code-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 120px;
}

.qr-code-container svg {
  width: 100%;
  max-width: 220px;
  height: auto;
}

@media (max-width: 780px) {
  .result-layout {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  .topic-input-row {
    flex-direction: column;
  }

  .topic-input-row .btn {
    width: 100%;
  }

  .cards-toolbar {
    flex-direction: column;
    align-items: flex-start;
  }

  .toolbar-buttons .btn {
    flex: 1 1 auto;
  }
}
</style>
</head>
<body>

  <header class="app-header">
    <h1>🎈 스캠퍼 발문 카드 만들기</h1>
    <p class="subtitle">주제어를 넣으면 아이디어 발문 카드가 뚝딱!</p>
  </header>

  <main>
    <!-- 시작 화면 -->
    <section id="screen-start" class="screen is-active">
      <form id="topic-form" class="topic-form">
        <label for="topic-input">오늘의 주제어를 적어보세요</label>
        <div class="topic-input-row">
          <input
            type="text"
            id="topic-input"
            name="topic"
            placeholder="예) 우산, 책가방, 물병..."
            maxlength="20"
            autocomplete="off"
          >
          <button type="submit" class="btn btn-primary">발문 만들기</button>
        </div>
        <p id="topic-error" class="error-message" hidden>주제어를 먼저 입력해 주세요.</p>
      </form>
    </section>

    <!-- 카드 화면 -->
    <section id="screen-cards" class="screen">
      <div class="cards-toolbar">
        <p class="current-topic">주제어: <strong id="current-topic-text"></strong></p>
        <div class="toolbar-buttons">
          <button type="button" id="btn-show-result" class="btn btn-primary">결과 보기</button>
          <button type="button" id="btn-back" class="btn btn-secondary">새 활동 시작</button>
          <button type="button" id="btn-reset" class="btn btn-danger">처음부터 다시하기</button>
        </div>
      </div>

      <div id="cards-container" class="cards-container">
        <!-- SCAMPER 카드 7개가 이 자리에 렌더링됩니다 -->
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen">
      <div class="cards-toolbar">
        <p class="current-topic">주제어: <strong id="result-topic-text"></strong></p>
        <div class="toolbar-buttons">
          <button type="button" id="btn-back-to-cards" class="btn btn-secondary">카드로 돌아가기</button>
        </div>
      </div>

      <div class="result-layout">
        <div class="result-summary-panel">
          <h2 class="result-panel-title">내가 적은 아이디어</h2>
          <ul id="result-summary-list" class="result-summary-list"></ul>
          <p id="result-empty-message" class="result-empty-message" hidden>
            아직 적은 아이디어가 없어요. 카드로 돌아가 답을 적어보세요!
          </p>
        </div>

        <div class="result-qr-panel">
          <h2 class="result-panel-title">QR코드로 보기</h2>
          <p class="result-qr-desc">친구나 선생님이 이 QR코드를 스캔하면 내 아이디어를 바로 볼 수 있어요.</p>
          <div id="qr-code-container" class="qr-code-container"></div>
          <p id="qr-error-message" class="error-message" hidden></p>
        </div>
      </div>
    </section>
  </main>

  <script>
  // ============================================================
  // QR Code Generator for JavaScript (kazuhikoarase/qrcode-generator, MIT License)
  // 오프라인 동작을 위해 이 파일 안에 그대로 포함했습니다.
  // 라이선스 전문: LICENSE-qrcode-generator.txt 참고
  // ============================================================
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;

          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)

              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),

const SCAMPER_ELEMENTS = [
  { key: "S", name: "대체하기", color: "#ff8a3d", bg: "#fff2e6" },
  { key: "C", name: "결합하기", color: "#f2b134", bg: "#fdf3dc" },

  { key: "P", name: "다른 용도로 사용하기", color: "#9b7fe0", bg: "#f3effc" },
  { key: "E", name: "제거하기", color: "#e35b6c", bg: "#fdedef" },
  { key: "R", name: "재배열·반대로 하기", color: "#37b8ad", bg: "#e9f8f6" },

// 받침 유무에 따라 조사(을/를, 은/는, 이/가, 과/와)를 판별합니다.
function hasBatchim(word) {
  if (!word) return false;
  const lastChar = word.trim().slice(-1);
  const code = lastChar.charCodeAt(0);
  if (code < 0xac00 || code > 0xd7a3) return false; // 한글 음절이 아니면 받침 없음으로 취급
  return (code - 0xac00) % 28 !== 0;
}

const JOSA_TABLE = {
  object: ["를", "을"], // 을/를
  topic: ["는", "은"], // 은/는
  subject: ["가", "이"], // 이/가
  with: ["와", "과"], // 과/와
};

function getJosa(word, type) {
  const pair = JOSA_TABLE[type];
  if (!pair) return "";
  return hasBatchim(word) ? pair[1] : pair[0];
}

// key: 요소 알파벳, value: 문장 템플릿 함수 배열 (topic을 받아 완성된 발문 문자열 반환)
const SCAMPER_TEMPLATES = {
  S: [
    (t) => `${t}${getJosa(t, "object")} 만드는 재료를 다른 것으로 바꾸면 어떻게 될까요?`,
    (t) => `${t} 대신 다른 물건을 쓴다면 무엇이 좋을까요?`,
    (t) => `${t}${getJosa(t, "object")} 만드는 방법을 다르게 바꿀 수 있을까요?`,
    (t) => `${t}의 모양을 완전히 다른 모양으로 바꾸면 어떨까요?`,
    (t) => `만약 ${t}${getJosa(t, "subject")} 이 세상에 없다면 무엇으로 대신할 수 있을까요?`,
    (t) => `${t}${getJosa(t, "object")} 만들 때 쓰는 색깔을 다른 색으로 바꾸면 어떨까요?`,
  ],
  C: [
    (t) => `${t}에 다른 물건을 합치면 어떤 새로운 물건이 될까요?`,
    (t) => `${t}${getJosa(t, "with")} 내가 좋아하는 물건을 합쳐볼까요?`,
    (t) => `${t}에 기능을 하나 더 더한다면 무엇을 넣고 싶나요?`,
    (t) => `${t}${getJosa(t, "with")} 어울리는 다른 물건은 무엇이 있을까요?`,
    (t) => `두 개의 ${t}${getJosa(t, "object")} 합쳐서 새로운 것을 만든다면 어떤 모습일까요?`,
    (t) => `${t}에 친구의 아이디어를 더한다면 무엇을 더하고 싶나요?`,
  ],
  A: [
    (t) => `${t}${getJosa(t, "with")} 비슷하게 생긴 다른 물건이 있을까요?`,
    (t) => `동물이나 식물의 특징을 ${t}에 적용할 수 있을까요?`,
    (t) => `다른 나라, 다른 시대의 ${t}${getJosa(t, "topic")} 어떤 모습일까요?`,
    (t) => `${t}${getJosa(t, "object")} 만들 때 자연에서 힌트를 얻는다면 무엇을 참고할 수 있을까요?`,
    (t) => `다른 물건에서 좋은 아이디어를 가져와 ${t}에 적용한다면 무엇을 가져오고 싶나요?`,
    (t) => `${t}${getJosa(t, "topic")} 원래 어떤 목적으로 만들어졌을까요? 다른 목적에도 쓸 수 있을까요?`,
  ],
  M: [
    (t) => `${t}의 크기를 아주 크게 만들면 어떤 점이 좋아질까요?`,
    (t) => `${t}의 모양이나 색깔을 바꾸면 어떨까요?`,
    (t) => `${t}의 한 부분을 아주 작게(또는 크게) 만들면 무슨 일이 생길까요?`,
    (t) => `${t}${getJosa(t, "object")} 더 가볍게 만들면 어떤 점이 좋아질까요?`,
    (t) => `${t}의 재료를 더 단단하게(또는 부드럽게) 바꾸면 어떨까요?`,
    (t) => `${t}의 소리나 냄새를 바꾼다면 어떨까요?`,
  ],
  P: [
    (t) => `${t}${getJosa(t, "object")} 원래 쓰임 말고 다르게 쓸 수 있는 곳이 있을까요?`,
    (t) => `어린이가 아닌 다른 사람이 ${t}${getJosa(t, "object")} 쓴다면 어떻게 쓸까요?`,
    (t) => `${t}${getJosa(t, "object")} 집이 아닌 다른 장소에서 쓴다면 어떨까요?`,
    (t) => `${t}${getJosa(t, "subject")} 장난감이 된다면 어떻게 가지고 놀 수 있을까요?`,
    (t) => `${t}${getJosa(t, "object")} 도움이 필요한 사람을 위해 쓴다면 어떻게 쓸 수 있을까요?`,
    (t) => `${t}${getJosa(t, "object")} 예술 작품을 만드는 데 쓴다면 어떤 작품이 나올까요?`,
  ],
  E: [
    (t) => `${t}에서 없어도 되는 부분은 무엇일까요?`,
    (t) => `${t}${getJosa(t, "object")} 더 가볍거나 간단하게 만들려면 무엇을 빼야 할까요?`,
    (t) => `${t}의 불편한 점 하나를 없앤다면 무엇을 없애고 싶나요?`,
    (t) => `${t}의 크기를 줄인다면 어떤 부분을 줄이고 싶나요?`,
    (t) => `${t}${getJosa(t, "object")} 반으로 나눈다면 어떤 모습이 될까요?`,
    (t) => `${t}의 장식이나 꾸밈을 없앤다면 어떻게 달라질까요?`,
  ],
  R: [
    (t) => `${t}의 순서나 위치를 바꾸면 어떻게 될까요?`,
    (t) => `${t}${getJosa(t, "object")} 거꾸로 뒤집으면 어떤 점이 좋아질까요?`,
    (t) => `${t}${getJosa(t, "object")} 반대로 사용한다면 어떤 모습일까요?`,
    (t) => `${t}의 안과 밖을 서로 바꾸면 어떨까요?`,
    (t) => `${t}${getJosa(t, "object")} 사용하는 순서를 완전히 다르게 해본다면 어떨까요?`,
    (t) => `${t}${getJosa(t, "subject")} 하는 일을 다른 물건이 하게 한다면 어떨까요?`,
  ],
};

const QUESTIONS_PER_CARD = 3;

// poolSize개 중 count개의 서로 다른 인덱스를 뽑습니다. excludeIndices는 가능하면 피합니다.
function pickRandomIndices(poolSize, count, excludeIndices = []) {
  const excludeSet = new Set(excludeIndices);
  let candidates = Array.from({ length: poolSize }, (_, i) => i).filter(
    (i) => !excludeSet.has(i)
  );

  if (candidates.length < count) {
    candidates = Array.from({ length: poolSize }, (_, i) => i);
  }

  const picked = [];
  while (picked.length < count && candidates.length > 0) {
    const randomIndex = Math.floor(Math.random() * candidates.length);
    picked.push(candidates.splice(randomIndex, 1)[0]);
  }
  return picked;
}
const STORAGE_KEY = "scamper-app-state";
const SAVE_DEBOUNCE_MS = 400;

const state = {
  topic: "",
  cards: {}, // { S: [q1, q2, q3], C: [...], ... }
  cardIndices: {}, // { S: [templateIndex1, templateIndex2, templateIndex3], ... }
  answers: {}, // { "S-0": "학생 답변", ... }
};

const el = {
  screenStart: document.getElementById("screen-start"),
  screenCards: document.getElementById("screen-cards"),
  screenResult: document.getElementById("screen-result"),
  topicForm: document.getElementById("topic-form"),
  topicInput: document.getElementById("topic-input"),
  topicError: document.getElementById("topic-error"),
  currentTopicText: document.getElementById("current-topic-text"),
  cardsContainer: document.getElementById("cards-container"),
  btnShowResult: document.getElementById("btn-show-result"),
  btnBack: document.getElementById("btn-back"),
  btnReset: document.getElementById("btn-reset"),
  btnBackToCards: document.getElementById("btn-back-to-cards"),
  resultTopicText: document.getElementById("result-topic-text"),
  resultSummaryList: document.getElementById("result-summary-list"),
  resultEmptyMessage: document.getElementById("result-empty-message"),
  qrContainer: document.getElementById("qr-code-container"),
  qrErrorMessage: document.getElementById("qr-error-message"),
};

function debounce(fn, delay) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

function showScreen(screenId) {
  for (const screen of [el.screenStart, el.screenCards, el.screenResult]) {
    screen.classList.toggle("is-active", screen.id === screenId);
  }
}

function generateElementQuestions(key, topic, excludeIndices = []) {
  const templates = SCAMPER_TEMPLATES[key];
  const indices = pickRandomIndices(templates.length, QUESTIONS_PER_CARD, excludeIndices);
  const questions = indices.map((i) => templates[i](topic));
  return { indices, questions };
}

function generateCards(topic) {
  state.cards = {};
  state.cardIndices = {};
  for (const { key } of SCAMPER_ELEMENTS) {
    const { indices, questions } = generateElementQuestions(key, topic);
    state.cardIndices[key] = indices;
    state.cards[key] = questions;
  }
  renderCards();
}

function renderCards() {
  el.cardsContainer.innerHTML = SCAMPER_ELEMENTS.map((element) => renderCard(element)).join("");
}

function renderCard(element) {
  const { key, name, color, bg } = element;
  const questions = state.cards[key] || [];

  const questionItems = questions
    .map((question, index) => {
      const answerKey = `${key}-${index}`;
      const answerValue = state.answers[answerKey] || "";
      return `
        <li class="question-item">
          <p class="question-text">${index + 1}. ${escapeHtml(question)}</p>
          <textarea
            class="answer-input"
            data-key="${key}"
            data-index="${index}"
            placeholder="내 생각을 적어보세요"
            rows="2"
          >${escapeHtml(answerValue)}</textarea>
        </li>`;
    })
    .join("");

  return `
    <article class="scamper-card" style="--card-color: ${color}; --card-bg: ${bg}">
      <header class="card-header">
        <span class="card-badge">${key}</span>
        <h2 class="card-title">${name}</h2>
      </header>
      <ul class="question-list">${questionItems}</ul>
      <button type="button" class="btn btn-outline btn-regenerate" data-action="regenerate" data-key="${key}">
        🔄 다른 질문 보기
      </button>
    </article>`;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function regenerateElement(key) {
  const prevIndices = state.cardIndices[key] || [];
  const { indices, questions } = generateElementQuestions(key, state.topic, prevIndices);
  state.cardIndices[key] = indices;
  state.cards[key] = questions;
  renderCards();
  saveState();
}

function getAnsweredItems() {
  const items = [];
  for (const element of SCAMPER_ELEMENTS) {
    const questions = state.cards[element.key] || [];
    questions.forEach((question, index) => {
      const answer = (state.answers[`${element.key}-${index}`] || "").trim();
      if (answer) {
        items.push({ element, question, answer });
      }
    });
  }
  return items;
}

function buildSummaryText(items, { includeQuestions = true } = {}) {
  const lines = [`[스캠퍼 발문 카드] 주제어: ${state.topic}`, ""];
  for (const { element, question, answer } of items) {
    if (includeQuestions) {
      lines.push(`[${element.key}] ${question}`);
      lines.push(`→ ${answer}`);
    } else {
      lines.push(`[${element.key}] ${answer}`);
    }
    lines.push("");
  }
  return lines.join("\n").trim();
}

function renderResultSummary(items) {
  el.resultTopicText.textContent = state.topic;
  el.resultEmptyMessage.hidden = items.length > 0;

  el.resultSummaryList.innerHTML = items
    .map(
      ({ element, question, answer }) => `
        <li class="result-summary-item" style="--card-color: ${element.color}; --card-bg: ${element.bg}">
          <span class="result-summary-badge">${element.key} · ${element.name}</span>
          <p class="result-summary-question">${escapeHtml(question)}</p>
          <p class="result-summary-answer">${escapeHtml(answer)}</p>
        </li>`
    )
    .join("");
}

const QR_ERROR_CORRECTION_LEVEL = "L";
const QR_MAX_TYPE_NUMBER = 40;

function tryBuildQr(text) {
  for (let typeNumber = 1; typeNumber <= QR_MAX_TYPE_NUMBER; typeNumber += 1) {
    try {
      const qr = qrcode(typeNumber, QR_ERROR_CORRECTION_LEVEL);
      qr.addData(text);
      qr.make();
      return qr;
    } catch (error) {
      // 이 크기로는 담을 수 없으면 다음 크기로 다시 시도합니다.
    }
  }
  return null;
}

function generateQrCode(items) {
  el.qrContainer.innerHTML = "";
  el.qrErrorMessage.hidden = true;

  if (items.length === 0) return;

  // 발문 원문까지 담아보고, 용량이 넘치면 답변만 담은 간략 버전으로 다시 시도합니다.
  const qr =
    tryBuildQr(buildSummaryText(items, { includeQuestions: true })) ||
    tryBuildQr(buildSummaryText(items, { includeQuestions: false }));

  if (qr) {
    el.qrContainer.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4 });
    return;
  }

  el.qrErrorMessage.textContent =
    "적은 내용이 너무 많아 QR코드를 만들 수 없어요. 카드 몇 개의 답변만 남겨보세요.";
  el.qrErrorMessage.hidden = false;
}

function renderResult() {
  const items = getAnsweredItems();
  renderResultSummary(items);
  generateQrCode(items);
}

function startWithTopic(topic) {
  state.topic = topic;
  state.answers = {};
  el.currentTopicText.textContent = topic;
  generateCards(topic);
  showScreen("screen-cards");
  saveState();
}

function resetAll() {
  state.topic = "";
  state.cards = {};
  state.cardIndices = {};
  state.answers = {};
  el.topicInput.value = "";
  el.cardsContainer.innerHTML = "";
  localStorage.removeItem(STORAGE_KEY);
  showScreen("screen-start");
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

const saveStateDebounced = debounce(saveState, SAVE_DEBOUNCE_MS);

function isValidCardsState(cards) {
  if (!cards) return false;
  return SCAMPER_ELEMENTS.every(
    ({ key }) => Array.isArray(cards[key]) && cards[key].length === QUESTIONS_PER_CARD
  );
}

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;

  try {
    const parsed = JSON.parse(saved);
    Object.assign(state, parsed);
  } catch {
    return;
  }

  if (!state.topic || typeof state.topic !== "string") return;

  el.topicInput.value = state.topic;
  el.currentTopicText.textContent = state.topic;
  state.answers = state.answers && typeof state.answers === "object" ? state.answers : {};

  if (isValidCardsState(state.cards)) {
    renderCards();
  } else {
    generateCards(state.topic);
  }
  showScreen("screen-cards");
}

el.topicForm.addEventListener("submit", (event) => {
  event.preventDefault();
  const topic = el.topicInput.value.trim();

  if (!topic) {
    el.topicError.hidden = false;
    return;
  }

  el.topicError.hidden = true;
  startWithTopic(topic);
});

el.btnBack.addEventListener("click", () => {
  el.topicInput.value = "";
  el.topicError.hidden = true;
  showScreen("screen-start");
  el.topicInput.focus();
});

el.btnReset.addEventListener("click", () => {
  if (confirm("저장된 내용이 모두 지워져요. 계속할까요?")) {
    resetAll();
  }
});

el.btnShowResult.addEventListener("click", () => {
  renderResult();
  showScreen("screen-result");
});

el.btnBackToCards.addEventListener("click", () => {
  showScreen("screen-cards");
});

el.cardsContainer.addEventListener("click", (event) => {
  const button = event.target.closest('[data-action="regenerate"]');
  if (!button) return;
  regenerateElement(button.dataset.key);
});

el.cardsContainer.addEventListener("input", (event) => {
  const textarea = event.target.closest(".answer-input");
  if (!textarea) return;
  const answerKey = `${textarea.dataset.key}-${textarea.dataset.index}`;
  state.answers[answerKey] = textarea.value;
  saveStateDebounced();
});

loadState();
  </script>
